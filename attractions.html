    <header class="hero-header" style="background-image: url('./images/im_bg2.jpg');">
        <h1>景点介绍</h1>
        <p>山河壮丽 · 塞外明珠</p>
    </header>

    <main class="container">
        <div class="bento-grid">
            <div class="bento-item col-2 row-2">
                <img src="./images/im_wlbt.jpg" alt="乌兰布统">
                <div class="bento-content">
                    <h3>乌兰布统草原</h3>
                    <p>摄影家的朝圣地，起伏的线条与白桦林构成了最完美的草原视觉大片。也是康熙平定乱战的古战场。</p>
                </div>
            </div>
            <div class="bento-item">
                <img src="./images/im_asht.jpg" alt="石林">
                <div class="bento-content">
                    <h3>阿斯哈图石林</h3>
                    <p>第四纪冰川地质奇迹。</p>
                </div>
            </div>
            <div class="bento-item">
                <img src="./images/im_dlne.jpg" alt="湖泊">
                <div class="bento-content">
                    <h3>达里诺尔湖</h3>
                    <p>“百鸟乐园”半咸水湖。</p>
                </div>
            </div>
            <div class="bento-item col-2">
                <img src="./images/im_ylsh.jpg" alt="沙湖">
                <div class="bento-content">
                    <h3>玉龙沙湖</h3>
                    <p>一半沙漠一半湖泊的绝美景致。</p>
                </div>
            </div>
        </div>
    </main>
