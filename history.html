<head>
    <meta charset="UTF-8">

    <title>文化历史 - 赤峰印象 | History</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .history-timeline { border-left: 3px solid var(--red); margin: 60px 0; padding-left: 40px; position: relative; }
        .timeline-item { margin-bottom: 60px; position: relative; }
        .timeline-item::before { content: ''; position: absolute; left: -52px; top: 0; width: 22px; height: 22px; background: var(--red); border-radius: 50%; border: 4px solid white; }
        .timeline-item h3 { color: var(--red); font-size: 24px; margin: 0 0 15px; }
        .timeline-item .era { font-weight: bold; font-size: 14px; background: var(--light-gray); padding: 3px 12px; border-radius: 30px; letter-spacing: 2px; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">赤峰印象</div>
        <div class="nav-links">
            <a href="index.html">首页</a>
            <a href="attractions.html">景点介绍</a>
            <a href="food.html">美食指南</a>
            <a href="history.html" class="active">文化历史</a>
            <a href="transport.html">交通住宿</a>
            <a href="strategy.html">旅游攻略</a>
        </div>
    </nav>

    <header class="hero-header" style="background-image: url('https://images.unsplash.com/photo-1542640244-7e672d6cef21');">
        <h1>文化历史</h1>
        <p>八千年文明 · 契丹风云</p>
    </header>

    <main class="container">
        <div class="history-timeline">
            <div class="timeline-item">
                <span class="era">8000年前</span>
                <h3>红山文化 · 龙的故乡</h3>
                <p style="color:var(--gray);">在三星他拉出土的碧玉龙，被证实是中华民族龙图腾的最早实证。红山文化从此响彻寰宇。</p>
            </div>
            <div class="timeline-item">
                <span class="era">公元916年</span>
                <h3>大辽故都 · 契丹风采</h3>
                <p style="color:var(--gray);">这里曾是辽王朝的政治、文化中心。辽上京、辽中京都见证了契丹民族在北方的辉煌统治。</p>
            </div>
            <div class="timeline-item">
                <span class="era">明清时期</span>
                <h3>蒙汉交融 · 丝路枢纽</h3>
                <p style="color:var(--gray);">长城的重要门户，塞外商贸繁荣之地，蒙汉文化在此深度交织融合。</p>
            </div>
        </div>
    </main>
