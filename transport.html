    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">赤峰印象</div>
        <div class="nav-links">
            <a href="index.html">首页</a>
            <a href="attractions.html">景点介绍</a>
            <a href="food.html">美食指南</a>

            <a href="transport.html" class="active">交通住宿</a>
            <a href="strategy.html">旅游攻略</a>
        </div>
    </nav>

    <header class="hero-header" style="background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b');">
        <h1>交通住宿</h1>
        <p>旅途畅达 · 惬意下榻</p>
    </header>

    <main class="container">
        <h2 style="font-size:32px; border-left: 6px solid var(--red); padding-left: 20px; margin-bottom: 40px;">极致交通</h2>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 30px;">
            <div style="background:white; padding: 40px; border-radius: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.03);">
                <h3 style="color:var(--red);">✈️ 玉龙机场</h3>
                <p style="font-size: 14px; color:var(--gray);">国内主要城市直飞，交通便利。</p>
            </div>
            <div style="background:white; padding: 40px; border-radius: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.03);">
                <h3 style="color:var(--red);">🚄 赤峰高铁站</h3>
                <p style="font-size: 14px; color:var(--gray);">京沈高铁支线，北京出发2小时直达。</p>
            </div>
            <div style="background:white; padding: 40px; border-radius: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.03);">
                <h3 style="color:var(--red);">🚗 自驾租车</h3>
                <p style="font-size: 14px; color:var(--gray);">草原自驾是最佳体验，市区有多家租车点。</p>
            </div>
        </div>

        <h2 style="font-size:32px; border-left: 6px solid var(--red); padding-left: 20px; margin: 80px 0 40px;">品质下榻</h2>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px;">
            <div style="position:relative; border-radius: 20px; overflow:hidden; height: 300px;">
                <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945" style="width:100%; height:100%; object-fit:cover;">
                <div style="position:absolute; inset:0; background:rgba(0,0,0,0.3); display:flex; align-items:flex-end; padding:40px; color:white;">
                    <div><h3>市区星级酒店</h3><p>奢华舒适，市中心首选。</p></div>
                </div>
            </div>
            <div style="position:relative; border-radius: 20px; overflow:hidden; height: 300px;">
                <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b" style="width:100%; height:100%; object-fit:cover;">
                <div style="position:absolute; inset:0; background:rgba(0,0,0,0.3); display:flex; align-items:flex-end; padding:40px; color:white;">
                    <div><h3>草原特色包/民宿</h3><p>枕着星空入眠，深度草原体验。</p></div>
                </div>
            </div>
        </div>
    </main>
    <!-- 复用首页页脚 -->
